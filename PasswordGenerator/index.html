<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div Class="container"> 
            <h1>Generate a <br><strong id="color">random password</strong></h1>
            <p>Never use an insecure password again.</p>  
        </div>
        <div class="setLength">
            <label for="length">Password Length:</label>
            <input type="number" id="length" min="1" max="100" value="15">
        </div>
        <div class="password">
            <button id="generate" onclick="generate()">Generate passwords</button>
            <div id="separator"></div>
        </div>
        <div class="passwordfields">
        <input type="text" id="password1" readonly onclick="copyText(this)" >
        <input type="text" id="password2" readonly>

       </div>
        <script src="index.js"></script>
    </body>
</html>
